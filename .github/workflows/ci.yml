name: CI - SDK Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install SDK dependencies
        run: bun install --frozen-lockfile

      - name: Build VXC compiler package
        run: bun run build:vxc

      - name: Build SDK
        run: bun run build

      - name: Lint (non-blocking — see PROBLEMS.md §3)
        run: bun run lint
        continue-on-error: true

      - name: Run SDK tests (with coverage thresholds)
        run: bun run test:ci

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-jest-results
          path: coverage
          if-no-files-found: ignore
