<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="3; url=https://vx.nknighta.me" />
    <link rel="canonical" href="https://vx.nknighta.me" />
    <title>VX3 Docs → vx.nknighta.me</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: "SF Mono", "Fira Code", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      .label {
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 1.5rem;
      }

      .arrow {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(6px); }
      }

      .url {
        font-size: 1.5rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 2rem;
      }

      .url a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid #444;
        padding-bottom: 2px;
        transition: border-color 0.2s;
      }

      .url a:hover {
        border-color: #fff;
      }

      .progress-bar {
        width: 240px;
        height: 2px;
        background: #1e1e1e;
        margin: 0 auto;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #fff;
        border-radius: 999px;
        animation: fill 3s linear forwards;
      }

      @keyframes fill {
        to { width: 100%; }
      }

      .countdown {
        font-size: 0.75rem;
        color: #444;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="label">VX3 Docs</div>
      <div class="arrow">↓</div>
      <div class="url">
        <a href="https://vx.nknighta.me">vx.nknighta.me</a>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="countdown" id="countdown">3 秒後にリダイレクト</div>
    </div>
    <script>
      let n = 3;
      const el = document.getElementById("countdown");
      const timer = setInterval(() => {
        n--;
        if (n <= 0) {
          clearInterval(timer);
          el.textContent = "Redirecting…";
          window.location.replace("https://vx.nknighta.me");
        } else {
          el.textContent = n + " 秒後にリダイレクト";
        }
      }, 1000);
    </script>
  </body>
</html>
